# Golden: k8s-resources #15385, applications/gtowiz-dwh/prod/templates/networkpolicy-mcp.yaml
# (verbatim spec, comments removed). tests/render-networkpolicy.sh compares the chart output to it.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: mcp-ingress
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: mcp
      app.kubernetes.io/instance: mcp
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: envoy-gateway-system
          podSelector:
            matchLabels:
              app.kubernetes.io/name: envoy
              app.kubernetes.io/component: proxy
      ports:
        - port: 8001
          protocol: TCP
