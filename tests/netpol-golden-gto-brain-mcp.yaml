# Golden: k8s-resources #15385, applications/gto-brain-mcp/services/templates/networkpolicy.yaml
# (verbatim spec, comments removed). tests/render-networkpolicy.sh compares the chart output to it.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: gto-brain-mcp-ingress
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: mcp
      app.kubernetes.io/part-of: gto-brain-mcp
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: envoy-gateway-system
          podSelector:
            matchLabels:
              app.kubernetes.io/name: envoy
              app.kubernetes.io/component: proxy
      ports:
        - port: 8090
          protocol: TCP
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: alloy
      ports:
        - port: 9090
          protocol: TCP
