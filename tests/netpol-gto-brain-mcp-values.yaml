# helm-template render fixture (see tests/README.md). Port and label shape of
# k8s-resources applications/gto-brain-mcp/services/values.mcp.yaml.
# Expected: same ingress as netpol-golden-gto-brain-mcp.yaml.
nameOverride: mcp
common:
  labels:
    component: mcp
    partOf: gto-brain-mcp
application:
  containerPort: 8090
  containerPortName: http
  extraContainerPorts:
    - containerPort: 9090
      name: metrics
      protocol: TCP
service:
  enabled: true
  port: 80
  name: http
  targetPortName: http
httpRoute:
  enabled: true
serviceMonitor:
  enabled: false
networkPolicy:
  enabled: true
  sameNamespace: false
