# k8s-resources #15385 mcp-ingress (gtowiz-dwh prod), as the chart renders it.
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: "mcp"
      app.kubernetes.io/instance: mcp
  policyTypes:
    - Ingress
  ingress:
    - from:
      - namespaceSelector:
          matchLabels:
            kubernetes.io/metadata.name: envoy-gateway-system
        podSelector:
          matchLabels:
            app.kubernetes.io/component: proxy
            app.kubernetes.io/name: envoy
      ports:
      - port: 8001
        protocol: TCP
