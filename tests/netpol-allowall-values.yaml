# helm-template render fixture (see tests/README.md). Break-glass mode.
# Expected: `ingress: [{}]` and no other rule, even with a gateway, allowFrom and an
# unresolvable targetPortName (break-glass must never fail the render).
nameOverride: mcp
service:
  enabled: true
  targetPortName: does-not-exist
httpRoute:
  enabled: true
networkPolicy:
  enabled: true
  allowAll: true
  allowFrom:
    - namespace: webapp
